# =============================================================================
# FreeToken Model Presets Configuration
# =============================================================================
# This file is used exclusively by FreeToken. Keys map directly to FreeToken 
# CLI arguments (e.g., `max-seq-len-override` maps to `--max-seq-len-override`).
# =============================================================================

[nvidia_Qwen3.6-35B-A3B-NVFP4]
alias = nvidia_Qwen3.6-35B-A3B-NVFP4
max-seq-len-override = 131072
max-running-requests = 1
kv-reserve-tokens = 131072
max-prefill-length = 4096
cuda-graph-max-bs = 1
cache-type = radix
enable-cache-report = true
enable-special-token-ckpt = true
sampling-defaults = model
tool-call-parser = qwen3_coder
moe-backend = offload
moe-prefill-hit-d2d = true
expert-load = parallel
nvfp4-backend = auto
memory-ratio = 0.88
moe-cache-auto = true
reasoning-parser = qwen3
